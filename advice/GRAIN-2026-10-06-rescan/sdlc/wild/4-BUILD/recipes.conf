#
# recipes.conf -- the ONE source for every Larder profile. gen.sh turns it into
# out/<profile>.{packages,pip,areas,preferences,firstrun.*} and out/larder-open.
# '#' starts a comment. Record kinds (first word of a line):
#
#   group NAME              the bare lines that follow are its members:
#     PKG [nff|local]         a Debian package; nff = Debian's non-free-firmware
#                             area, local = our own .deb, not from Debian
#     pip:NAME                a PyPI package (not in Debian, see 2-ANALYSIS.md)
#   profile NAME | GROUPS | SURFACES | DENY
#                           GROUPS: comma list or '*' (all). SURFACES: html, el
#                           or html,el (first is the default). DENY: Debian
#                           packages that must NOT be installed ('-' for none).
#   surface NAME | PKG      the package a first-run surface needs
#   choice ID | LABEL | HELP | NEEDS | RUN
#                           one button. NEEDS is a package or '-'. Repeating an
#                           ID adds a fallback: the first one whose NEEDS the
#                           profile has is shown. RUN uses only [a-z0-9 ._=-].

group core
live-boot
live-config
cryptsetup
cryptsetup-initramfs
network-manager
wpasupplicant
wireguard-tools
gnupg
openssh-client
rsync
ca-certificates
firmware-linux nff
firmware-iwlwifi nff
firmware-realtek nff
firmware-atheros nff
firmware-brcm80211 nff
intel-microcode nff
amd64-microcode nff
larder-tools local

# Mesh stack. None of these four is in Debian; the two that carry a licence
# note (rns, sbapp) are not DFSG-free. See 2-ANALYSIS.md R4 before shipping.
group mesh
python3-venv
pip:rns
pip:lxmf
pip:nomadnet
pip:sbapp

group xlite
xserver-xorg
xinit
matchbox-window-manager
xterm
emacs-lucid
x11-xserver-utils

group xfce
