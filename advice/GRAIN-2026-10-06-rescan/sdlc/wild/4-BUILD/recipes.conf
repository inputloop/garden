profile minimal  | core,mesh,xlite                                       | el      | -
profile desktop  | core,mesh,xfce,office,library,files,privacy           | html    | -
profile homelab  | core,mesh,xlite,library,privacy,server                | el      | -
profile hardened | core,mesh,xfce,office,library,files,privacy,hardening | html    | bluez,avahi-daemon,cups,cups-browsed,openssh-server
profile fullsink | *                                                     | html,el | -

surface html | firefox-esr
surface el   | emacs-lucid

choice setup    | Set up this stick             | Choose a name and a PIN. Do this first.            | larder-tools          | larder-setup --first-run
choice guide    | Read the short guide          | Five minutes, plain words.                         | larder-tools          | larder-guide
choice network  | Connect to a network          | Wifi or a cable.                                   | network-manager-gnome | nm-connection-editor
choice network  | Connect to a network          | Wifi or a cable.                                   | xterm                 | xterm -e nmtui
choice chat     | Message other organizers      | Over the mesh radio or over the internet.          | pip:sbapp             | sideband
choice chat     | Message other organizers      | Over the mesh radio or over the internet.          | pip:nomadnet          | xterm -e nomadnet
choice docs     | Write & edit documents        | Letters, flyers and spreadsheets.                  | libreoffice-writer    | libreoffice --writer
choice library  | Open the offline library      | Books, first aid, food safety. No internet needed. | kiwix                 | kiwix-desktop
choice files    | Sync files with your chapter  | Needs your chapter's server and the internet.      | nextcloud-desktop     | nextcloud
choice editions | Books & extras on this stick  | Extra editions this stick carries.                 | larder-tools          | larder-editions
choice close    | Close this and use the laptop | Nothing is lost.                                  | larder-tools          | larder-close
choice shutdown | Lock and shut down           | Your files stay safe on the stick.                 | larder-tools          | larder-shutdown
